name: Build iPhone USB 4K Webcam (.IPA & .EXE)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Install and Run XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build iOS App Payload
        run: |
          mkdir -p build/Build/Products/Release-iphoneos
          xcodebuild -project USBWebcam.xcodeproj \
                     -scheme USBWebcam \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build
          
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/USBWebcam.app Payload/
          zip -r USBWebcam.ipa Payload
          mkdir -p output
          mv USBWebcam.ipa output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: output/USBWebcam.ipa

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python pyqt5 pyinstaller pyvirtualcam libusbmuxd

      - name: Build Standalone Windows EXE
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "USB_4K_Webcam_Host" desktop/main.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/USB_4K_Webcam_Host

  package-zip:
    name: Bundle Final Full ZIP
    needs: [build-ios, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release/Windows_Host/

      - name: Create ZIP Release Package
        run: |
          cd release
          zip -r ../USB_Webcam_4K_1440p_Package.zip .

      - name: Upload Complete Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Complete-USB-Webcam-Package
          path: USB_Webcam_4K_1440p_Package.zip
